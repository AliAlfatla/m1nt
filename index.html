<title>M1NT</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04120f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#02100d; --glass:rgba(8,44,39,.62); --line:rgba(92,255,200,.26);
  --mint:#5cffc8; --mint-dim:#2fae8a; --text:#e2fff5; --muted:#86bdae;
  --warn:#ffc857; --bad:#ff7b72; --demo:#9db7ff;
  --font-d:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html.tv body{overflow:hidden}
html.tv .app{position:fixed;left:50%;top:50%;width:1280px;height:720px;max-width:none;box-sizing:border-box;transform:translate(-50%,-50%) scale(var(--tvk,1));transform-origin:center center}
html.tv{cursor:none}
html.tv .hint,html.tv .banner{display:none}

body{margin:0;background:radial-gradient(1100px 760px at 50% 46%,#0b3d35 0%,var(--ink) 64%) fixed,var(--ink);color:var(--text);font-family:var(--font-d);font-size:15px;line-height:1.45;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(92,255,200,.03) 0 1px,transparent 1px 3px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));position:relative;z-index:1}

.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:flex-end;min-height:34px}
.brand{display:flex;align-items:center;gap:9px;opacity:.9}
.glyph{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,var(--mint) 0 22%,transparent 25%),conic-gradient(from 0deg,var(--mint),transparent 30%,var(--mint-dim) 60%,transparent 85%,var(--mint));-webkit-mask:radial-gradient(circle,#000 0 66%,transparent 68%);mask:radial-gradient(circle,#000 0 66%,transparent 68%)}
h1{font-size:14px;letter-spacing:.24em;text-transform:uppercase;margin:0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.chip{font-family:var(--font-m);font-size:11px;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line);background:rgba(4,24,21,.5);padding:4px 10px;border-radius:999px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;min-height:30px;white-space:nowrap}
button.chip{cursor:pointer}
button.chip:hover,button.chip[aria-pressed="true"]{border-color:var(--mint);color:var(--text)}
.chip.go{background:var(--mint);color:#02100d;border-color:var(--mint);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.dot.demo{background:var(--demo);box-shadow:0 0 8px var(--demo)}
.dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.dot.live{background:var(--bad);box-shadow:0 0 10px var(--bad);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.35}}
.meter{width:34px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;display:inline-block}
.meter i{display:block;height:100%;width:0;background:var(--mint);transition:width .08s}

.stage{position:relative;min-height:0;display:grid;grid-template-columns:minmax(210px,300px) minmax(0,1fr) minmax(210px,300px);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:14px 18px;align-items:stretch;overflow:hidden}
#fx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.center{grid-column:2;grid-row:1 / span 2;position:relative;display:grid;place-items:center;min-width:0;min-height:0}
.wakebtn{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:0;background:transparent;cursor:pointer;z-index:3}
.app:not([data-state="asleep"]) .wakebtn{display:none}
.resp{position:relative;z-index:2;width:min(680px,100%);max-height:100%;overflow:auto;text-align:center;padding:10px 12px;opacity:0;transform:scale(.94);pointer-events:none;transition:opacity .45s .12s,transform .6s cubic-bezier(.2,.8,.2,1)}
.app[data-state="answer"] .resp{opacity:1;transform:none;pointer-events:auto}
.app[data-state="answer"] .panel{opacity:0!important;pointer-events:none!important;visibility:hidden}
.app[data-state="answer"] .center{grid-column:1 / -1;place-items:start center;padding:10px 230px 4px}
.app[data-state="answer"] .resp{width:min(780px,100%);margin-top:4px;text-align:left;padding:20px 26px 18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,var(--glass),rgba(4,24,21,.74));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.app[data-state="answer"] .ans{text-align:left;margin-top:8px}
.app[data-state="answer"] .rows,.app[data-state="answer"] .cards,.app[data-state="answer"] .banner{margin-left:0;margin-right:0;max-width:none}
.app[data-state="answer"] .src,.app[data-state="answer"] .acts{justify-content:flex-start}
.ctag{position:absolute;left:54px;top:214px;width:124px;text-align:center;font-family:var(--font-m);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);opacity:0;transition:opacity .4s;pointer-events:none;z-index:3}
.app[data-state="answer"] .ctag{opacity:.9}
.app[data-mode="idle"] .ctag,.app[data-mode="listening"] .ctag{color:var(--muted)}
.asked{font-family:var(--font-m);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;overflow-wrap:anywhere}
.asked b{color:var(--mint);font-weight:500}
.doing{margin:8px 0 0;font-family:var(--font-m);font-size:12px;color:var(--mint);letter-spacing:.06em;min-height:18px}
.doing.done{color:var(--muted)}
.ans{margin:10px 0 0;font-size:clamp(22px,2.8vw,36px);line-height:1.2;font-weight:500;letter-spacing:-.01em;overflow-wrap:anywhere}
.ans.small{font-size:clamp(18px,2.1vw,26px)}
.rows{margin:14px auto 0;text-align:left;display:grid;gap:8px;max-width:620px}
.row{display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:12px;border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:9px 12px;font-size:16px}
.row .t{font-family:var(--font-m);font-size:12px;color:var(--mint);padding-top:3px}
.row .n{overflow-wrap:anywhere}
.row .note{color:var(--muted);font-size:13px;margin-top:2px}
.cards{margin:14px auto 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:620px;text-align:left}
.card{text-align:left;font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--glass);border-radius:12px;padding:10px 12px;min-width:0}
.card:hover{border-color:var(--mint);box-shadow:0 0 22px rgba(92,255,200,.15)}
.card h3{margin:0;font-family:var(--font-m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}
.card .big{font-size:24px;font-weight:700;margin:2px 0}
.card .l1{font-size:13px;overflow-wrap:anywhere}
.tag{font-family:var(--font-m);font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:1px 6px;border-radius:5px;border:1px solid currentColor;white-space:nowrap;font-weight:400}
.tag.live{color:var(--mint)} .tag.saved{color:var(--warn)} .tag.demo,.tag.snap{color:var(--demo)} .tag.na{color:var(--bad)} .tag.ok{color:var(--mint)}
.src{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-family:var(--font-m);font-size:11px;color:var(--muted)}
.acts{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{cursor:pointer;border:1px solid var(--line);background:rgba(4,24,21,.6);border-radius:999px;padding:7px 14px;font-size:13px;min-height:36px}
.btn:hover{border-color:var(--mint)} .btn.pri{background:var(--mint);color:#02100d;border-color:var(--mint);font-weight:700}
.btn[disabled]{opacity:.5;cursor:default}
.banner{margin:12px auto 0;max-width:620px;border:1px solid var(--line);border-left:3px solid var(--demo);background:rgba(157,183,255,.08);border-radius:8px;padding:8px 12px;text-align:left;font-size:14px;overflow-wrap:anywhere}
.banner.na{border-left-color:var(--bad);background:rgba(255,123,114,.08)}
.banner.warn{border-left-color:var(--warn);background:rgba(255,200,87,.07)}
.banner.ok{border-left-color:var(--mint);background:rgba(92,255,200,.07)}

.panel{position:relative;z-index:2;text-align:left;cursor:pointer;border:1px solid var(--line);background:linear-gradient(160deg,var(--glass),rgba(4,24,21,.72));border-radius:16px;padding:14px 16px;min-width:0;align-self:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .55s,transform .65s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .2s;opacity:0;pointer-events:none}
.panel[data-pos="l"]{grid-column:1;transform:translateX(-46px) scale(.96)}
.panel[data-pos="r"]{grid-column:3;transform:translateX(46px) scale(.96)}
.panel[data-i="0"]{grid-row:1}.panel[data-i="1"]{grid-row:2}
.app:not([data-state="asleep"]) .panel{opacity:1;pointer-events:auto;transform:none}
.app:not([data-state="asleep"]) .panel[data-i="1"]{transition-delay:.08s}
.panel:hover{border-color:var(--mint);box-shadow:0 0 30px rgba(92,255,200,.2)}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--mint);opacity:.8}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph h2{margin:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.pbig{font-size:clamp(20px,2vw,28px);font-weight:500;margin:8px 0 2px;overflow-wrap:anywhere}
.psub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.popen{font-family:var(--font-m);font-size:11px;letter-spacing:.1em;color:var(--mint);margin-top:8px;text-transform:uppercase}

.dock{display:grid;gap:7px;justify-items:center}
.bar{width:min(760px,100%);display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:6px 8px 6px 6px;transition:opacity .5s}
.app[data-state="asleep"] .bar{opacity:.45}
.bar:focus-within{opacity:1;border-color:var(--mint);box-shadow:0 0 28px rgba(92,255,200,.2)}
.bar input{background:transparent;border:0;outline:0;min-width:0;padding:8px 6px;font-size:16px}
.bar input::placeholder{color:var(--muted)}
.rb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(4,24,21,.7);cursor:pointer;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.rb:hover{border-color:var(--mint)} .rb.on{background:var(--mint);color:#02100d;box-shadow:0 0 24px var(--mint)}
.rb svg{width:20px;height:20px}
.rb.muted{color:var(--bad);border-color:var(--bad)}
.sendb{width:42px;height:42px;border-radius:50%;border:0;background:var(--mint);color:#02100d;cursor:pointer;display:grid;place-items:center}
.sendb svg{width:20px;height:20px}
.sugs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;transition:opacity .5s}
.sugs .btn{font-size:12px;padding:5px 11px;min-height:30px;color:var(--text)}
.app[data-state="asleep"] .sugs,.app[data-state="asleep"] .foldbtn{opacity:0;pointer-events:none}
.hint{font-family:var(--font-m);font-size:11px;color:var(--muted);text-align:center;min-height:15px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:6;top:0;right:0;bottom:0;width:min(500px,100%);background:linear-gradient(170deg,rgba(7,40,35,.97),rgba(3,18,16,.98));border-left:1px solid var(--line);transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.show{transform:none}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px 8px}
.dh h2{margin:0;font-size:15px;letter-spacing:.2em;text-transform:uppercase}
.dh .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-family:var(--font-m);font-size:11px;color:var(--muted)}
.db{overflow:auto;padding:6px 18px 24px;display:grid;gap:10px;align-content:start}
.item{border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:10px 12px}
.item b{font-weight:500}
.item .sm{color:var(--muted);font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.item .k{font-family:var(--font-m);font-size:11px;color:var(--mint);letter-spacing:.06em;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item details{margin-top:6px;color:var(--muted);font-size:12px;font-family:var(--font-m)}
.item details div{white-space:pre-wrap;overflow-wrap:anywhere}
.item summary{cursor:pointer;color:var(--mint)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:6px 0 0}
.kv dt{color:var(--muted);font-family:var(--font-m);font-size:12px}
.kv dd{margin:0;overflow-wrap:anywhere}
.hist{padding:0;list-style:none;margin:0;display:grid;gap:10px}
.empty{color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:10px;padding:12px}
.sel{background:rgba(4,24,21,.8);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:36px;max-width:100%}
.sec{font-family:var(--font-m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}

@media(max-width:900px){
  .stage{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) auto auto}
  .center{grid-column:1 / span 2;grid-row:1}
  .panel[data-i="0"][data-pos="l"]{grid-column:1;grid-row:2}.panel[data-i="1"][data-pos="l"]{grid-column:1;grid-row:3}
  .panel[data-i="0"][data-pos="r"]{grid-column:2;grid-row:2}.panel[data-i="1"][data-pos="r"]{grid-column:2;grid-row:3}
  .panel{padding:9px 11px;border-radius:12px}
  .panel[data-pos="l"],.panel[data-pos="r"]{transform:translateY(24px)}
  .pbig{font-size:16px;margin:4px 0 0}.psub{font-size:11px}.popen{display:none}
  .chip{font-size:10px;padding:3px 8px}
  .row{grid-template-columns:1fr;gap:2px}
  .app[data-state="answer"] .panel{display:none}
  .app[data-state="answer"] .center{padding:122px 0 4px}
  .app[data-state="answer"] .resp{width:100%;padding:16px 16px 14px}
  .ctag{left:118px;width:auto;text-align:left;top:62px;font-size:10px}
}

/* ---------- phone mode: just the core ---------- */
.app.mob .top{position:fixed;top:8px;right:8px;left:8px;z-index:30;justify-content:flex-end}
.app.mob .chips .chip{display:none}
.app.mob .chips #muteBtn,.app.mob .chips #setBtn,.app.mob .chips #enableMic{display:inline-flex}
.app.mob .chips #enableMic[hidden]{display:none}
.app.mob .panel,.app.mob .sugs,.app.mob .ctag,.app.mob #spk,.app.mob .sendb{display:none!important}
.app.mob .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 0 max(18px,env(safe-area-inset-bottom));pointer-events:none}
.app.mob .dock>*{pointer-events:auto}
.app.mob .bar{background:transparent;border:0;box-shadow:none;padding:0;width:auto}
.app.mob #micBtn{width:84px;height:84px;border-radius:50%;background:rgba(92,255,200,.14);border:1.5px solid var(--mint);color:var(--mint);box-shadow:0 0 34px rgba(92,255,200,.45);display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.app.mob #micBtn svg{width:38px;height:38px}
.app.mob #micBtn.on{background:var(--mint);color:#04140f;animation:micPulse 1.1s ease-in-out infinite}
@keyframes micPulse{50%{box-shadow:0 0 56px rgba(92,255,200,.9)}}
.app.mob #cmd{display:none}
.app.mob.typing #cmd{display:block;position:fixed;left:12px;right:12px;bottom:118px;width:auto}
.app.mob .hint{position:fixed;left:0;right:0;bottom:116px;text-align:center;font-size:12px;opacity:.85}
.app.mob[data-state="idle"] .hint,.app.mob[data-state="awake"] .hint{bottom:128px}
.app.mob .dock::before{content:'';position:fixed;left:0;right:0;bottom:0;height:150px;background:linear-gradient(to top,rgba(3,16,13,.96) 35%,transparent);pointer-events:none;z-index:-1}
.app.mob .typebtn{position:fixed;left:14px;bottom:34px;z-index:31;background:transparent;border:1px solid var(--line);color:var(--mint);border-radius:999px;padding:8px 14px;font:600 11px var(--font-m);letter-spacing:.1em}
.app:not(.mob) .typebtn{display:none}
.app.mob .resp{max-height:calc(100vh - 250px);overflow:auto}
.app.mob #acts .btn{padding:8px 12px}

.app.mob .stage{display:block;position:fixed;inset:0;z-index:1}
.app.mob .center{position:absolute;inset:0;display:grid;place-items:center;padding:0}
.app.mob[data-state="answer"] .center{display:block;padding:92px 8px 124px;overflow:auto}
.app.mob[data-state="answer"] .resp{width:100%;max-height:none;padding:14px 12px;margin:0}
.app.mob .wakebtn{width:230px;height:230px;margin:-115px 0 0 -115px}

.nc.hub{cursor:pointer;transition:transform .2s,box-shadow .2s}.nc.hub:hover{transform:translateY(-3px);box-shadow:0 0 26px rgba(92,255,200,.45)}
.nc.fu{cursor:pointer}.nc.fu.done{opacity:.45}.nc.fu.done .nc-w{text-decoration:line-through}
.vault{position:relative;width:min(780px,100%);height:min(440px,62vh);margin:14px auto;perspective:1400px}
.v-in{position:absolute;inset:0;overflow:auto;padding:6px;border-radius:18px;border:1px solid var(--line);background:rgba(4,22,19,.75)}
.v-door{position:absolute;inset:0;transform-origin:left center;transition:transform 1.5s cubic-bezier(.6,0,.2,1),opacity .4s 1.2s;border:2px solid var(--mint);border-radius:18px;background:repeating-linear-gradient(135deg,rgba(92,255,200,.05) 0 8px,transparent 8px 16px),linear-gradient(160deg,#0a2d27,#041512);box-shadow:0 0 40px rgba(92,255,200,.3),inset 0 0 40px rgba(0,0,0,.6);display:grid;place-items:center;backface-visibility:hidden}
.vault.open .v-door{transform:rotateY(-112deg);opacity:0}
.v-wheel{width:190px;height:190px;border-radius:50%;border:3px solid var(--mint);position:relative;display:grid;place-items:center;box-shadow:0 0 30px rgba(92,255,200,.5)}
.v-wheel::before,.v-wheel::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 10deg,rgba(92,255,200,.9) 10deg 12deg,transparent 12deg 30deg);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%,#000 100%);mask:radial-gradient(circle,transparent 58%,#000 60%,#000 100%);animation:vspin 3.2s cubic-bezier(.5,0,.3,1) forwards}
.v-wheel::after{inset:18px;animation-direction:reverse;opacity:.7;animation-duration:2.6s}
.vault.unlocked .v-wheel{animation:vclunk .5s}
@keyframes vspin{to{transform:rotate(720deg)}}
@keyframes vclunk{40%{transform:scale(1.08) rotate(14deg)}}
.v-core{font:700 13px var(--font-m);letter-spacing:.16em;color:var(--mint)}
.v-code{display:flex;gap:10px;position:absolute;top:34px}
.v-slot{width:46px;height:58px;border:1px solid var(--mint);border-radius:10px;display:grid;place-items:center;font:700 26px var(--font-m);color:var(--mint);background:rgba(0,0,0,.4)}
.v-slot.lk{background:rgba(92,255,200,.25);box-shadow:0 0 18px rgba(92,255,200,.7)}
.v-st{position:absolute;bottom:26px;font:600 11px var(--font-m);letter-spacing:.18em;color:var(--mint);text-align:center;padding:0 12px}

<script>

/* ---------- shared data helpers ---------- */
function parseNext(str){
  var m=/^(?:\w+\s+)?([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?/.exec(String(str||'').trim());if(!m)return null;

/* ---------- deposits board ---------- */
async function cmdDeposits(q,opt){
  beginAsk(q);doing('reading deposits and payments through Make');var my=cur;

  if((/^(search|look up|google|find out|news)\b|latest news|what('?s| is) the news|\b(what time|when) (does|do|is) .+ (close|open|closes|opens)\b|\bhours\b|\bis .+ open\b|\bphone number\b|\baddress (for|of)\b|\bhow (much|many|old|tall|far)\b|^who (is|was)\b|^what (is|are|was) (a|an|the)\b/.test(l))&&!/deposit|payment|\bjobs?\b|customer|credit|usage|schedule|calendar|appointment|lead/.test(l)){var ch=!opt.clarified&&needsPlace(q);if(ch){askPlace(q,ch);return;}cmdWeb(q,opt);return;}
  if(/what('?s| is)? ?(needs|need) me|needs me|need my attention|waiting on me|what should i (do|handle)/.test(l)){cmdNeeds(q,opt);return;}
  var sched=/(schedule|calendar|agenda|what'?s on|what is on|appointments?|jobs? (today|tomorrow)|what do i have)/.test(l);
  if(sched&&/(this week\b|next week|next few|upcoming|the week)/.test(l)&&!/weekend/.test(l)){cmdWeek(q,opt);return;}
  if(sched){var so=wxOffset(q);if(so!=null){cmdSchedule(q,so,so===0?'today':(so===1?'tomorrow':wxDayName(so)),opt);return;}}
  if(/\bleads?\b/.test(l)){cmdOpen(q,'leads','leads');return;}
  if(/(customers?|texts?|messages?|inbox|threads?|handoffs?)/.test(l)){cmdOpen(q,'customers','customers');return;}
  if(/(deposits?|square|payments?)/.test(l)){cmdOpen(q,'deposits','deposits');return;}

  cmdUnknown(q);
}
