<style>

  --mint:#5cffc8; --mint-dim:#2fae8a; --text:#e2fff5; --muted:#86bdae;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 760px at 50% 46%,#0b3d35 0%,var(--ink) 64%) fixed,var(--ink);color:var(--text);font-family:var(--font-d);font-size:15px;line-height:1.45;overflow:hidden}

:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));position:relative;z-index:1}

.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:flex-end;min-height:34px}
.brand{display:flex;align-items:center;gap:9px;opacity:.9}

h1{font-size:14px;letter-spacing:.24em;text-transform:uppercase;margin:0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.chip{font-family:var(--font-m);font-size:11px;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line);background:rgba(4,24,21,.5);padding:4px 10px;border-radius:999px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;min-height:30px;white-space:nowrap}
button.chip{cursor:pointer}
button.chip:hover,button.chip[aria-pressed="true"]{border-color:var(--mint);color:var(--text)}
.chip.go{background:var(--mint);color:#02100d;border-color:var(--mint);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.dot.demo{background:var(--demo);box-shadow:0 0 8px var(--demo)}
.dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}

.meter i{display:block;height:100%;width:0;background:var(--mint);transition:width .08s}

.stage{position:relative;min-height:0;display:grid;grid-template-columns:minmax(210px,300px) minmax(0,1fr) minmax(210px,300px);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:14px 18px;align-items:stretch;overflow:hidden}
#fx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.center{grid-column:2;grid-row:1 / span 2;position:relative;display:grid;place-items:center;min-width:0;min-height:0}

.app[data-state="answer"] .resp{opacity:1;transform:none;pointer-events:auto}
.app[data-state="answer"] .panel{opacity:0!important;pointer-events:none!important;visibility:hidden}
.app[data-state="answer"] .center{grid-column:1 / -1;place-items:start center;padding:10px 230px 4px}
.app[data-state="answer"] .resp{width:min(780px,100%);margin-top:4px;text-align:left;padding:20px 26px 18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,var(--glass),rgba(4,24,21,.74));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.app[data-state="answer"] .ans{text-align:left;margin-top:8px}
.app[data-state="answer"] .rows,.app[data-state="answer"] .cards,.app[data-state="answer"] .banner{margin-left:0;margin-right:0;max-width:none}
.app[data-state="answer"] .src,.app[data-state="answer"] .acts{justify-content:flex-start}
.ctag{position:absolute;left:54px;top:214px;width:124px;text-align:center;font-family:var(--font-m);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);opacity:0;transition:opacity .4s;pointer-events:none;z-index:3}
.app[data-state="answer"] .ctag{opacity:.9}
.app[data-mode="idle"] .ctag,.app[data-mode="listening"] .ctag{color:var(--muted)}
.asked{font-family:var(--font-m);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;overflow-wrap:anywhere}
.asked b{color:var(--mint);font-weight:500}
.doing{margin:8px 0 0;font-family:var(--font-m);font-size:12px;color:var(--mint);letter-spacing:.06em;min-height:18px}

.rows{margin:14px auto 0;text-align:left;display:grid;gap:8px;max-width:620px}
.row{display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:12px;border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:9px 12px;font-size:16px}
.row .t{font-family:var(--font-m);font-size:12px;color:var(--mint);padding-top:3px}
.row .n{overflow-wrap:anywhere}
.row .note{color:var(--muted);font-size:13px;margin-top:2px}
.cards{margin:14px auto 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:620px;text-align:left}
.card{text-align:left;font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--glass);border-radius:12px;padding:10px 12px;min-width:0}
.card:hover{border-color:var(--mint);box-shadow:0 0 22px rgba(92,255,200,.15)}
.card h3{margin:0;font-family:var(--font-m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}
.card .big{font-size:24px;font-weight:700;margin:2px 0}
.card .l1{font-size:13px;overflow-wrap:anywhere}
.tag{font-family:var(--font-m);font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:1px 6px;border-radius:5px;border:1px solid currentColor;white-space:nowrap;font-weight:400}
.tag.live{color:var(--mint)} .tag.saved{color:var(--warn)} .tag.demo,.tag.snap{color:var(--demo)} .tag.na{color:var(--bad)} .tag.ok{color:var(--mint)}
.src{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-family:var(--font-m);font-size:11px;color:var(--muted)}
.acts{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{cursor:pointer;border:1px solid var(--line);background:rgba(4,24,21,.6);border-radius:999px;padding:7px 14px;font-size:13px;min-height:36px}
.btn:hover{border-color:var(--mint)} .btn.pri{background:var(--mint);color:#02100d;border-color:var(--mint);font-weight:700}
.btn[disabled]{opacity:.5;cursor:default}
.banner{margin:12px auto 0;max-width:620px;border:1px solid var(--line);border-left:3px solid var(--demo);background:rgba(157,183,255,.08);border-radius:8px;padding:8px 12px;text-align:left;font-size:14px;overflow-wrap:anywhere}
.banner.na{border-left-color:var(--bad);background:rgba(255,123,114,.08)}
.banner.warn{border-left-color:var(--warn);background:rgba(255,200,87,.07)}

.panel{position:relative;z-index:2;text-align:left;cursor:pointer;border:1px solid var(--line);background:linear-gradient(160deg,var(--glass),rgba(4,24,21,.72));border-radius:16px;padding:14px 16px;min-width:0;align-self:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .55s,transform .65s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .2s;opacity:0;pointer-events:none}

.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--mint);opacity:.8}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph h2{margin:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.pbig{font-size:clamp(20px,2vw,28px);font-weight:500;margin:8px 0 2px;overflow-wrap:anywhere}
.psub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.popen{font-family:var(--font-m);font-size:11px;letter-spacing:.1em;color:var(--mint);margin-top:8px;text-transform:uppercase}

.dock{display:grid;gap:7px;justify-items:center}
.bar{width:min(760px,100%);display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:6px 8px 6px 6px;transition:opacity .5s}

.bar input{background:transparent;border:0;outline:0;min-width:0;padding:8px 6px;font-size:16px}
.bar input::placeholder{color:var(--muted)}
.rb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(4,24,21,.7);cursor:pointer;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.rb:hover{border-color:var(--mint)} .rb.on{background:var(--mint);color:#02100d;box-shadow:0 0 24px var(--mint)}
.rb svg{width:20px;height:20px}
.rb.muted{color:var(--bad);border-color:var(--bad)}
.sendb{width:42px;height:42px;border-radius:50%;border:0;background:var(--mint);color:#02100d;cursor:pointer;display:grid;place-items:center}
.sendb svg{width:20px;height:20px}
.sugs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;transition:opacity .5s}
.sugs .btn{font-size:12px;padding:5px 11px;min-height:30px;color:var(--text)}
.app[data-state="asleep"] .sugs,.app[data-state="asleep"] .foldbtn{opacity:0;pointer-events:none}
.hint{font-family:var(--font-m);font-size:11px;color:var(--muted);text-align:center;min-height:15px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:6;top:0;right:0;bottom:0;width:min(500px,100%);background:linear-gradient(170deg,rgba(7,40,35,.97),rgba(3,18,16,.98));border-left:1px solid var(--line);transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.show{transform:none}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px 8px}
.dh h2{margin:0;font-size:15px;letter-spacing:.2em;text-transform:uppercase}
.dh .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-family:var(--font-m);font-size:11px;color:var(--muted)}
.db{overflow:auto;padding:6px 18px 24px;display:grid;gap:10px;align-content:start}
.item{border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:10px 12px}
.item b{font-weight:500}
.item .sm{color:var(--muted);font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.item .k{font-family:var(--font-m);font-size:11px;color:var(--mint);letter-spacing:.06em;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item details{margin-top:6px;color:var(--muted);font-size:12px;font-family:var(--font-m)}
.item details div{white-space:pre-wrap;overflow-wrap:anywhere}
.item summary{cursor:pointer;color:var(--mint)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:6px 0 0}
.kv dt{color:var(--muted);font-family:var(--font-m);font-size:12px}
.kv dd{margin:0;overflow-wrap:anywhere}
.hist{padding:0;list-style:none;margin:0;display:grid;gap:10px}
.empty{color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:10px;padding:12px}
.sel{background:rgba(4,24,21,.8);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:36px;max-width:100%}
.sec{font-family:var(--font-m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}

function draw(now){

  var ga=1-aw*0.7;

  g.addColorStop(0,'rgba(190,255,235,'+(0.9*ga)+')');g.addColorStop(0.15,'rgba(92,255,200,'+(0.55*ga)+')');g.addColorStop(0.5,'rgba(47,174,138,'+(0.18+aw*0.05)+')');g.addColorStop(1,'rgba(47,174,138,0)');

    var r=i===0?(rSleep+(rOpen-rSleep)*aw*0.4+((maxR*0.34)-rSleep)*aw*0.6):(rSleep+(rOpen-rSleep)*aw);

function parseQuo(text){

    var m=line.match(/^\s+(AC\w+)\s+\|\s+(incoming|outgoing)\s+\|\s+(\d{4}-\d\d-\d\dT[\d:.]+Z)\s+\|\s?(.*)$/);

function parseThread(text){

function handleWake(t,isFinal){

    if(!isAwake()){wakeUi();try{window.focus();}catch(e){}$('hint').textContent='Awake and listening. Ask me anything. Say “Goodnight, Mint” to fold.';setMode('listening');}

function wakeSink(be){

async function cmdBridge(q,opt){
  beginAsk(q);doing('thinking it through with Claude (live web and your data)');setMode('thinking');
  var ctl=new AbortController();var tm=setTimeout(function(){ctl.abort();},45000);
  try{
    var qq=q;
    if(/\b(brief me|briefing|catch me up|what do i need to know|how does my day look|start my day|rundown)\b/i.test(q)){try{qq+='\n\n[Live weather from Open-Meteo for Louisville: '+await wxBlurb()+']';}catch(e){}}
    var r=await fetch(BR.url,{method:'POST',body:new URLSearchParams({code:BR.code,q:qq,history:histText()}),signal:ctl.signal});
    var t=(await r.text()).trim();clearTimeout(tm);
    if(!r.ok)throw new Error('The bridge answered HTTP '+r.status+'.');
    if(/^Accepted$/i.test(t)){bridgeFail(q,'The bridge did not accept the access code. Paste your link again in Setup.');return;}
    if(!t||/^M1NT_BRIDGE_ERROR/.test(t)){bridgeFail(q,'Claude did not answer.');return;}
    addUse('claude',1);usageChip();
    finish({headline:t,small:true,spoken:t,tags:[srcTag('live','Claude via Make'),srcTag('live','Answered '+clockET(Date.now())+' ET')],srcNote:'Live web search plus your saved calendar, bookings and deposit snapshots. Read-only.',acts:[{label:'Ask again',fn:function(){run(q,{});}}]});
  }catch(e){clearTimeout(tm);bridgeFail(q,e&&e.name==='AbortError'?'The lookup took longer than 45 seconds.':failCopy(e));}
}
function followUp(q,opt){
  var L=convo.last,l=q.toLowerCase();
  var wc=q.trim().split(/\s+/).length;
  if(!(/^(and|what about|how about|what if|also|then|same|ok|okay|now)\b/i.test(q.trim())||wc<=4||(wxOffset(q)!=null&&wc<=5)))return false;
  if(/\b(weather|forecast|rain|snow|temperature)\b/.test(l)&&L.kind!=='weather'){convo.wxFollow=true;run('weather '+q,{voice:true,wake:true,reply:'x'});return true;}
  if(/\b(schedule|calendar|deposit|lead|customer|jobs?|brief|needs me)\b/.test(l))return false;
  if(L.kind==='schedule'){if(wxOffset(q)==null&&!/\b(evening|morning|afternoon)\b/.test(l))return false;run('schedule '+q,{voice:true,wake:true,reply:'x'});return true;}
  if(L.kind==='weather'){convo.wxFollow=true;run('weather '+q,{voice:true,wake:true,reply:'x'});return true;}
  if(L.kind==='football'){run(q+' football score',{voice:true,wake:true,reply:'x'});return true;}
  if(L.kind==='web'){if(/\b(weather|forecast|football|score)\b/.test(l))return false;cmdWebFollow(q,L,opt);return true;}
  return false;
}
async function cmdWebFollow(q,L,opt){
  beginAsk(q);doing('working out what you mean');
  var rr=await askClaude('Rewrite the follow-up as ONE standalone web-search question. Keep the store, place or address from the earlier question. Output only the question.\nEarlier question: '+L.q+'\nEarlier answer: '+L.a+'\nFollow-up: '+q,'working out your follow-up (uses your Claude usage)');
  var sq=String(rr.text||'').split('\n')[0].trim();if(rr.error||sq.length<8)sq=L.q.replace(/[?.!]+$/,'')+' — '+q;
  logMic('reply','follow-up as: '+sq.slice(0,80));
  cmdWeb(sq,Object.assign({},opt,{clarified:true}));
}
function run(raw,opt){
  opt=opt||{};var q=String(raw||'').trim();if(!q)return;$('hint').textContent='';
  convo.armAfterSpeech=null;convo.armOk=!!opt.voice||wake.on;
  if(opt.fresh){convo.pending=null;convo.last=null;}
  if(convo.pending&&(opt.reply||shortReply(q))){var comp=completePending(q);if(comp){logMic('reply','completed: '+comp.slice(0,70));q=comp;opt.clarified=true;}}
  else if(convo.pending&&Date.now()>convo.pending.until)convo.pending=null;
  if(opt.reply==='follow'&&convo.last&&Date.now()-convo.last.at<300000&&followUp(q,opt))return;
  var l=q.toLowerCase();
  if(!BR&&/\b(cancel|delete|refund|charge|transfer|send money|reschedule|resume|pause|book (a|an|me|him|her|them)|take (a )?payment|waive)\b/.test(l)){cmdLocked(q);return;}
  var wcq=q.split(/\s+/).length;
  if(isGoodnight(q)){sleepUi();return;}
  if(/\b(weather|forecast|temperature|umbrella|how (hot|cold)|will it (rain|snow))\b/.test(l)&&(!BR||wcq<=8)){cmdWeather(q);return;}
  if((/\b(football|nfl|score|scores|who won|touchdown|playing|game|halftime|quarter|kickoff)\b/.test(l)||/how (is|are) (the )?[a-z .]+ (doing|playing)|did (the )?[a-z .]+ (win|lose)/.test(l))&&!/schedule|calendar/.test(l)&&(!BR||wcq<=8)){cmdFootball(q);return;}
  if(BR){cmdBridge(q,opt);return;}
  if((/^(search|look up|google|find out|news)\b|latest news|what('?s| is) the news|\b(what time|when) (does|do|is) .+ (close|open|closes|opens)\b|\bhours\b|\bis .+ open\b|\bphone number\b|\baddress (for|of)\b|\bhow (much|many|old|tall|far)\b|^who (is|was)\b|^what (is|are|was) (a|an|the)\b/.test(l))&&!/deposit|payment|\bjobs?\b|customer|credit|usage|schedule|calendar|appointment|lead/.test(l)){var ch=!opt.clarified&&needsPlace(q);if(ch){askPlace(q,ch);return;}cmdWeb(q,opt);return;}
  if(/what('?s| is)? ?(needs|need) me|needs me|need my attention|waiting on me|what should i (do|handle)/.test(l)){cmdNeeds(q,opt);return;}
  var sched=/(schedule|calendar|agenda|what'?s on|what is on|appointments?|jobs? (today|tomorrow)|what do i have)/.test(l);
  if(sched&&/(this week\b|next week|next few|upcoming|the week)/.test(l)&&!/weekend/.test(l)){cmdWeek(q,opt);return;}
  if(sched){var so=wxOffset(q);if(so!=null){cmdSchedule(q,so,so===0?'today':(so===1?'tomorrow':wxDayName(so)),opt);return;}}
  if(/\bleads?\b/.test(l)){cmdOpen(q,'leads','leads');return;}
  if(/(customers?|texts?|messages?|inbox|threads?|handoffs?)/.test(l)){cmdOpen(q,'customers','customers');return;}
  if(/(deposits?|square|payments?)/.test(l)){cmdOpen(q,'deposits','deposits');return;}
  if(/(health|running|status|workflows?|scenarios?|make)\b/.test(l)){cmdOpen(q,'health','system health');return;}
  if(/\bjobs?\b|upcoming/.test(l)){cmdOpen(q,'jobs','jobs');return;}
  if(/brief/.test(l)){cmdBriefing(q,opt);return;}
  if(sched){cmdSchedule(q,0,'today',opt);return;}
  cmdUnknown(q);
}

function renderSetup(){

    ['Connectors',['Make','Quo','Notion'].map(function(n){return n+': '+(servers[n]||'unknown');}).join(' · ')]
  ];

  var bin=el('input','sel');bin.type='text';bin.placeholder='Paste: https://hook… then a space and your code';bin.style.cssText='width:100%;margin-top:8px';bin.setAttribute('aria-label','Bridge address and code');
  var bs=el('button','btn pri','Save');bs.type='button';bs.addEventListener('click',function(){if(setBridge(bin.value)){bin.value='';renderSetup();}else bi.appendChild(el('div','sm','That does not look right. It should be the https://hook… address, a space, then the code.'));});
  var bt=el('button','btn','Test');bt.type='button';bt.addEventListener('click',function(){if(!BR)return;closeDrawer();run('Say hello in one short sentence.',{});});
  var bf=el('button','btn','Forget');bf.type='button';bf.addEventListener('click',function(){BR=null;store('bridge',null);renderSetup();});
  var bb=el('div');bb.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:8px';bb.appendChild(bs);bb.appendChild(bt);bb.appendChild(bf);bi.appendChild(bin);bi.appendChild(bb);dBody.appendChild(bi);
  var mi=el('div','item');mi.appendChild(el('div','k','MICROPHONE'));
  var eb=el('button','btn pri','Enable microphone');eb.type='button';eb.addEventListener('click',function(){eb.disabled=true;enableMic().then(function(){eb.disabled=false;});});
  var tb=el('button','btn','Test speech recognition');tb.type='button';tb.addEventListener('click',async function(){tb.disabled=true;tb.textContent='Listening 4 s… speak';await initMic();wakeUi();var r=await testMicRecognition();mic.diag=mic.diag||{at:Date.now()};mic.diag.speechTest=r;renderSetup();});
  var br=el('div');br.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:8px';br.appendChild(eb);br.appendChild(tb);mi.appendChild(br);
  if(dg){var t=el('div','sm');t.style.marginTop='8px';t.textContent='Last check '+stampET(dg.at)+'. Mic access: '+(dg.result?(dg.result.kind==='ok'?'OK':'failed'+(dg.result.name?' ('+dg.result.name+(dg.result.msg?': '+dg.result.msg:'')+')':'')):'not tested')+'. Runs inside: '+(dg.standalone?'standalone page':(dg.inApp?'Claude desktop app':'a web browser'))+'. Browser permission state: '+(dg.perm||'unreadable')+'. Claude dictation offered: '+(dg.dictation?'yes':'no')+'. Browser speech recognition present: '+(dg.sr?'yes':'no')+'.';mi.appendChild(t);
    if(dg.result){var cause=el('div','banner '+(dg.result.kind==='ok'?'ok':'na'));cause.appendChild(el('b',null,dg.result.kind==='ok'?'RESULT. ':'WHAT TO DO. '));cause.appendChild(document.createTextNode(dg.result.text));mi.appendChild(cause);}
    if(dg.speechTest){var st=el('div','banner '+(dg.speechTest.ok?'ok':'na'));st.appendChild(el('b',null,'SPEECH TEST. '));st.appendChild(document.createTextNode(dg.speechTest.detail));mi.appendChild(st);}
  }else{mi.appendChild(el('div','sm','Press Enable microphone first. It asks the window for the mic and tells you exactly why if it cannot.'));}
  dBody.appendChild(mi);
  var li=el('div','item');li.appendChild(el('div','k','MIC LOG (newest last)'));
  var lg=el('div','sm');lg.style.cssText='font-family:var(--font-m);font-size:11px;white-space:pre-wrap;max-height:180px;overflow:auto';lg.textContent=micLog.length?micLog.slice(-30).map(function(x){return stampET(x.at).replace(' ET','')+'  '+x.kind+'  '+x.detail;}).join('\n'):'Nothing yet. Turn on Hey Mint to start logging.';li.appendChild(lg);
  var cp=el('button','btn','Copy log');cp.type='button';cp.style.marginTop='8px';cp.addEventListener('click',function(){try{navigator.clipboard.writeText('M1NT build '+BUILD+' · '+navigator.userAgent+'\n'+lg.textContent);cp.textContent='Copied';}catch(e){cp.textContent='Copy failed';}});li.appendChild(cp);
  li.appendChild(el('div','sm','Build '+BUILD+' · '+(STANDALONE?'standalone page':(INAPP?'Claude desktop app':'browser'))));dBody.appendChild(li);
  var vi=el('div','item');vi.appendChild(el('div','k','VOICE'));

  var haveAny=false;
  if(tts){var g1=el('optgroup');g1.label='Claude voices';CLAUDE_VOICES.forEach(function(v){addOpt(g1,v.charAt(0).toUpperCase()+v.slice(1),'claude:'+v);});sel.appendChild(g1);haveAny=true;}
  var lv=localVoices();
  if(lv.length){var g2=el('optgroup');g2.label='Windows / browser voices ('+lv.length+')';lv.forEach(function(v){addOpt(g2,(v.nat?'★ ':'')+v.name+' · '+v.lang,'local:'+v.name);});sel.appendChild(g2);haveAny=true;}
  var cursel=(pref.kind==='local'?'local:'+pref.name:(pref.kind==='claude'?'claude:'+pref.name:(tts?'claude:buttery':(lv[0]?'local:'+lv[0].name:''))));
  if(haveAny){sel.value=cursel;vi.appendChild(sel);}else vi.appendChild(el('div','sm','No voices are available in this window. Answers stay on screen.'));
  sel.addEventListener('change',function(){var p=sel.value.split(':');pref.kind=p[0];pref.name=p.slice(1).join(':');store('voice',pref);});
  var ps=el('select','sel');ps.setAttribute('aria-label','Pace');[['Calm',0.92],['Conversational',0.98],['Brisk',1.08]].forEach(function(p){var o=el('option',null,p[0]);o.value=String(p[1]);ps.appendChild(o);});ps.value=String(pref.pace||0.98);if(!ps.value)ps.value='0.98';
  ps.addEventListener('change',function(){pref.pace=parseFloat(ps.value);store('voice',pref);});
  var row=el('div');row.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center';row.appendChild(ps);
  var tv=el('button','btn','Test voice');tv.type='button';tv.addEventListener('click',function(){speak('Good afternoon, Ali. This is how I sound. Tomorrow you have one job at eleven. Everything else looks quiet.',true);});row.appendChild(tv);
  var sp2=el('button','btn','Stop');sp2.type='button';sp2.addEventListener('click',stopSpeak);row.appendChild(sp2);
  vi.appendChild(row);
  function brit(g){var re=g==='m'?/ryan|thomas|george|daniel|oliver|arthur|male/i:/sonia|libby|maisie|hazel|susan|serena|female/i;var l=lv.filter(function(v){return /en[-_]GB/i.test(v.lang)&&re.test(v.name)&&(g==='m'?!/female/i.test(v.name):true);});l.sort(function(a,b){return b.nat-a.nat;});return l[0]||null;}
  var bm=brit('m'),bf=brit('f');
  vi.appendChild(el('div','sec','British voices (same sample)'));var br2=el('div');br2.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin-top:6px';
  [['Male',bm],['Female',bf]].forEach(function(x){var b=el('button','btn',x[1]?'▶ '+x[0]+': '+x[1].name.replace(/^Microsoft\s+/,'').slice(0,30):x[0]+': not found on this device');b.type='button';b.disabled=!x[1];if(x[1]){b.addEventListener('click',function(){speak(SAMPLE,true,{kind:'local',name:x[1].name,pace:pref.pace});});var u=el('button','btn','Use');u.type='button';u.addEventListener('click',function(){pref.kind='local';pref.name=x[1].name;store('voice',pref);renderSetup();});br2.appendChild(b);br2.appendChild(u);}else br2.appendChild(b);});vi.appendChild(br2);
  var SAMPLE='Good afternoon, Ali. Tomorrow you have one job at eleven. Everything else looks quiet.';
  var samples=[];if(tts)CLAUDE_VOICES.forEach(function(v){samples.push(['Claude · '+v,{kind:'claude',name:v,pace:pref.pace}]);});
  lv.slice(0,5).forEach(function(v){samples.push([v.name.replace(/^Microsoft\s+/,'').slice(0,28),{kind:'local',name:v.name,pace:pref.pace}]);});
  if(samples.length){vi.appendChild(el('div','sec','Same sample, each voice'));var sr2=el('div');sr2.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin-top:6px';samples.forEach(function(x){var b=el('button','btn','▶ '+x[0]);b.type='button';b.addEventListener('click',function(){speak(SAMPLE,true,x[1]);});sr2.appendChild(b);});vi.appendChild(sr2);}
  else vi.appendChild(el('div','banner na','NO VOICES HERE. This window offers neither Claude voices nor Windows voices'+(INAPP?' (the Claude desktop app reports an empty voice list)':'')+', so there is nothing to play. Answers stay readable in the center. In Chrome or Edge on Windows the same page lists the Windows voices, including the “Online (Natural)” ones in Edge.'));
  var sil=el('select','sel');sil.setAttribute('aria-label','Silence before sending');[['0.8 s',800],['1.0 s (start)',1000],['1.4 s',1400],['1.8 s',1800]].forEach(function(p){var o=el('option',null,p[0]);o.value=String(p[1]);sil.appendChild(o);});sil.value=String(SIL);
  sil.addEventListener('change',function(){SIL=parseInt(sil.value,10);store('sil',SIL);});
  var sr3=el('div');sr3.style.cssText='display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap';sr3.appendChild(el('span','sm','Send after silence:'));sr3.appendChild(sil);vi.appendChild(sr3);
  vi.appendChild(el('div','sm','Simplest better voice if these still sound robotic: an online text-to-speech service (for example OpenAI or ElevenLabs voices). Typical cost is a few dollars a month at your volume, billed by that service, plus about 1 Make credit per spoken answer if routed through Make. The answer text would go from this page to a small Make webhook, which calls the service and returns audio. I will not add it without your OK.'));
  vi.appendChild(el('div','sm','Starred voices are the natural-sounding ones Windows or your browser reports (names containing Natural, Online or Neural). Claude voices appear only in the main Claude window. Muted answers stay readable in the center.'));
  dBody.appendChild(vi);
  dBody.appendChild(item('IPHONE · INSIDE CLAUDE','Typed commands work; voice may not','Claude’s mic and voice are not offered in the mobile apps. Tap the keyboard’s microphone key to dictate into the box and read answers on screen.'));
  dBody.appendChild(item('SIRI · “ASK MINT”','Not built yet','It needs a new secured Make webhook that returns the answer text. That adds a public endpoint and about 1 credit per ask, so it waits for your OK.'));
  dBody.appendChild(item('SAFETY','Read-only on this screen','Voice only asks questions. Cancels, bookings, deletes, money, pause and resume stay on your Quo texts with your safety code.'));
}

updatePanels();setUi('asleep');setMode('idle');micUi();
(async function(){
  await probeLink();await initMic();
  try{if(navigator.permissions&&navigator.permissions.query){var ps=await navigator.permissions.query({name:'microphone'});if(ps.state==='granted'){mic.perm='ready';}else if(ps.state==='denied'){mic.perm='blocked';}ps.onchange=function(){mic.perm=ps.state==='granted'?'ready':(ps.state==='denied'?'blocked':'unknown');micUi();};}}catch(e){}
  micUi();
})();
